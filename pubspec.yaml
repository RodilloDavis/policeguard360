name: policeguard360
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # HTTP — same package used by LifeGuard360 main app for Firebase REST calls
  http: ^1.1.0
  # Maps
  google_maps_flutter: ^2.5.3
  google_maps_flutter_android: ^2.3.0
  google_maps_flutter_platform_interface: ^2.4.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5
  geolocator: ^14.0.2
  shared_preferences: ^2.3.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^22.2.0
  firebase_database: ^12.4.6
  # Signs the JWT used to obtain an FCM v1 OAuth token, so an acknowledge
  # message can be pushed straight to the reporter's device.
  dart_jsonwebtoken: ^3.3.2
  # Google Sign-In — same versions as LifeGuard360 main app
  firebase_auth: ^6.5.7
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
  macos:
    generate: true
    image_path: assets/icon/icon.png
